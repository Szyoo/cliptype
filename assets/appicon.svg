  <rect x="442" y="238" width="140" height="74" rx="24" fill="#B3C1D4"/>
  <circle cx="512" cy="268" r="13" fill="#4593F2"/>
  <!-- テキスト行 -->
  <rect x="384" y="402" width="256" height="34" rx="17" fill="#9AA7B8"/>
  <rect x="384" y="478" width="256" height="34" rx="17" fill="#9AA7B8"/>
  <rect x="384" y="554" width="148" height="34" rx="17" fill="#9AA7B8"/>

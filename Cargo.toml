[package]
name = "cliptype"
version = "0.1.0"
edition = "2021"
description = "Type the contents of your clipboard as simulated keystrokes. Cross-platform (macOS, Windows, Linux)."
license = "MIT"
repository = "https://github.com/USERNAME/cliptype"
readme = "README.md"
keywords = ["clipboard", "keyboard", "automation", "paste", "input"]
categories = ["command-line-utilities"]

[dependencies]
# キーストローク送信（クロスプラットフォームの入力シミュレーション）
enigo = "0.2"
# クリップボード読み取り（macOS / Windows / Linux 対応）
arboard = "3"
# CLI 引数パース
clap = { version = "4", features = ["derive"] }
# エラーハンドリング
anyhow = "1"

# グローバルホットキー（デーモンモード用、後続で実装予定）
[dependencies.global-hotkey]
version = "0.6"
optional = true

[features]
# ホットキー常駐モードは任意機能として分離
hotkey = ["dep:global-hotkey"]

[profile.release]
opt-level = "z"   # バイナリサイズ優先
lto = true
strip = true

name: Release

# v* タグの push で三プラットフォームのバイナリをビルドして GitHub Release に添付する
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS / Windows はトレイ UI 込み、Linux はホットキーまで
          # （トレイは GTK 依存が重いため Linux 非対応）
          - os: macos-latest
            target: aarch64-apple-darwin
            features: tray
          - os: macos-latest
            target: x86_64-apple-darwin
            features: tray
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            features: tray
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            features: hotkey

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxdo-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --features ${{ matrix.features }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf cliptype-${{ github.ref_name }}-${{ matrix.target }}.tar.gz cliptype
          shasum -a 256 cliptype-${{ github.ref_name }}-${{ matrix.target }}.tar.gz > cliptype-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path cliptype.exe -DestinationPath cliptype-${{ github.ref_name }}-${{ matrix.target }}.zip
          (Get-FileHash cliptype-${{ github.ref_name }}-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower() + "  cliptype-${{ github.ref_name }}-${{ matrix.target }}.zip" | Out-File -Encoding ascii cliptype-${{ github.ref_name }}-${{ matrix.target }}.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cliptype-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/cliptype-*.tar.gz*
            target/${{ matrix.target }}/release/cliptype-*.zip*
          if-no-files-found: error

  build-macos-app:
    name: build (macOS app, universal)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # 署名用証明書（自己署名）。Secrets が無いフォークでは ad-hoc にフォールバック。
      # 証明書署名だと署名要件が版をまたいで同じになり、ユーザーのアクセシビリティ
      # 許可がアップデート後も維持される（ad-hoc は毎ビルド変わる）。
      # キーチェーンの取り込みは bundle-macos.sh が一時キーチェーンで行う。
      - name: Prepare signing certificate
        env:
          P12_BASE64: ${{ secrets.MACOS_SIGNING_P12_BASE64 }}
        run: |
          if [ -n "$P12_BASE64" ]; then
            echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/signing.p12"
            echo "CODESIGN_P12=$RUNNER_TEMP/signing.p12" >> "$GITHUB_ENV"
            echo "signing certificate available"
          else
            echo "no signing certificate secret — will sign ad-hoc"
          fi

      - name: Build Cliptype.app (universal)
        env:
          CODESIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGNING_P12_PASSWORD }}
        run: BUILD_UNIVERSAL=1 scripts/bundle-macos.sh

      - name: Show signature
        run: codesign -dvv dist/Cliptype.app 2>&1 | grep -E "Authority|Signature|Identifier" ; codesign -d -r- dist/Cliptype.app 2>&1 | grep designated

      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent Cliptype.app cliptype-${{ github.ref_name }}-macos-app-universal.zip
          shasum -a 256 cliptype-${{ github.ref_name }}-macos-app-universal.zip > cliptype-${{ github.ref_name }}-macos-app-universal.zip.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cliptype-macos-app
          path: dist/cliptype-*.zip*
          if-no-files-found: error

  release:
    name: create release
    needs: [build, build-macos-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # リリース本文は CHANGELOG から作る（コミット一覧の自動生成は使わない）
      - name: Build release notes
        run: scripts/release-notes.sh "${{ github.ref_name }}" > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          body_path: release-notes.md
